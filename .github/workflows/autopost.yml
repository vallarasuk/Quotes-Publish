name: Auto-Post Romantic Quotes

on:
  schedule:
    # Runs 3 times a day: 8:00 AM, 2:00 PM, and 8:00 PM (UTC)
    - cron: '0 8,14,20 * * *'
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  post_quote:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit used_quotes.txt back to the repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Auto-Poster Script
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python quote_poster.py

      - name: Commit and Push Updated Used Quotes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add used_quotes.txt
          
          # Only commit if used_quotes.txt actually changed
          if ! git diff --staged --quiet; then
            git commit -m "chore: update used_quotes.txt [skip ci]"
            git push
          else
            echo "No new quotes were used, nothing to commit."
          fi
